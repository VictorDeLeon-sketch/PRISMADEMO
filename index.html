<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISMA | Aprendizaje Adaptativo</title>

    <!-- Fonts: Inter, Outfit, Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS (CDN for Static) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        neon: {
                            blue: '#00f3ff',
                            pink: '#ff00aa',
                            purple: '#bc13fe',
                            green: '#0aff00',
                            yellow: '#fae100', // Neon Yellow
                            cyan: '#00f3ff',
                        },
                        dark: {
                            bg: '#111111', // Elegant Charcoal Gray
                            surface: '#181818',
                            card: '#202020',
                            lighter: '#2a2a2a'
                        }
                    },
                    boxShadow: {
                        'neon-blue': '0 0 10px rgba(0, 243, 255, 0.5), 0 0 20px rgba(0, 243, 255, 0.3)',
                        'neon-pink': '0 0 10px rgba(255, 0, 170, 0.5), 0 0 20px rgba(255, 0, 170, 0.3)',
                        'glow': '0 0 15px rgba(255,255,255,0.1)',
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Third Party Libs -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-dark-bg text-gray-200 antialiased font-sans overflow-x-hidden">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 bg-dark-bg/80 backdrop-blur-lg border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-3 cursor-pointer" onclick="App.handleLogoClick()">
                    <!-- New Prism Logo (Image) -->
                    <div class="relative w-14 h-14 flex items-center justify-center group">
                        <img src="assets/logo.png" alt="PRISMA Logo"
                            class="w-full h-full object-contain drop-shadow-[0_0_8px_rgba(0,243,255,0.3)] transition-transform group-hover:scale-110 duration-300">
                    </div>
                    <span class="font-display font-bold text-2xl tracking-wide text-white">PRISMA</span>
                </div>

                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-6" id="navbar-actions">
                    <!-- Search Button (Hidden by default) -->
                    <div id="search-container" class="hidden relative group mx-4">
                        <input type="text" placeholder="Buscar cursos, temas..."
                            class="bg-dark-surface border border-white/10 rounded-full py-2 px-5 pl-10 text-sm text-white focus:outline-none focus:border-neon-blue w-0 group-hover:w-64 focus:w-64 transition-all duration-300 opacity-0 group-hover:opacity-100 focus:opacity-100 focus:w-80 placeholder-gray-500">
                        <div
                            class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400 group-hover:text-white">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>

                        <!-- Search Suggestions Dropdown -->
                        <div id="search-suggestions"
                            class="hidden absolute top-full left-0 right-0 mt-2 bg-dark-card border border-white/10 rounded-xl shadow-2xl z-50 overflow-hidden max-h-80 overflow-y-auto animate-fade-in">
                            <!-- Suggestions appended here via JS -->
                        </div>
                    </div>
                    <a href="#cursos"
                        class="hidden text-gray-400 hover:text-white transition-colors text-sm font-medium">Materias</a>
                    <a href="#metodo"
                        class="hidden text-gray-400 hover:text-white transition-colors text-sm font-medium">Método</a>
                    <div id="nav-back-container" class="hidden">
                        <button onclick="window.history.back()"
                            class="flex items-center gap-2 text-gray-400 hover:text-white transition-colors text-sm font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                            </svg>
                            <span>Volver</span>
                        </button>
                    </div>
                    <!-- User Profile/Login Container -->
                    <div id="auth-container">
                        <!-- Default: Ingresar Button -->
                        <button id="btn-login" onclick="window.location.href='login.html'"
                            class="flex items-center gap-2 px-5 py-2 rounded-full border border-neon-blue/30 bg-neon-blue/10 text-neon-blue hover:bg-neon-blue/20 transition-all shadow-[0_0_10px_rgba(0,243,255,0.2)]">
                            <span class="text-sm font-bold tracking-wide">Ingresar</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1">
                                </path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Shell -->
    <main id="app" class="pt-24 min-h-screen relative">
        <!-- Content will be injected here by app.js -->

        <!-- Background Gradients -->
        <div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden">
            <div
                class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] bg-neon-purple/10 rounded-full blur-[100px]">
            </div>
            <div
                class="absolute bottom-[-10%] left-[-5%] w-[500px] h-[500px] bg-neon-blue/10 rounded-full blur-[100px]">
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="data/curriculum.js?v=4"></script>
    <script src="js/state.js"></script>
    <script src="js/renderers.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Init Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            fontFamily: 'Inter',
            securityLevel: 'loose',
            flowchart: { curve: 'basis' }
        });
    </script>
</body>

</html>
